<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הסעות לכדורסל</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg: #12161f;
  --panel: #1b212e;
  --panel-2: #232a3a;
  --line: #313a4d;
  --court: #cf9f66;
  --court-dark: #a67a45;
  --orange: #e8630a;
  --orange-light: #ff8a3d;
  --white-line: #eee7d8;
  --text: #eef0f4;
  --muted: #8c93a4;
  --green: #3fae6a;
}

*{ box-sizing: border-box; }

body{
  margin:0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height:100vh;
}

.wrap{
  max-width: 640px;
  margin: 0 auto;
  padding: 0 0 60px;
}

/* HERO */
.hero{
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, #1a2030 0%, #12161f 100%);
  padding: 16px 24px 14px;
  border-bottom: 1px solid var(--line);
}
.hero::before{
  content:"";
  position:absolute;
  top: -90px; left: 50%;
  transform: translateX(-50%);
  width: 320px; height: 320px;
  border: 2px solid rgba(238,231,216,0.06);
  border-radius: 50%;
}
.hero::after{
  content:"";
  position:absolute;
  bottom: -140px; right: -60px;
  width: 260px; height: 260px;
  border: 2px solid rgba(232,99,10,0.10);
  border-radius: 50%;
}
.hero-top{
  position: relative;
  display:flex;
  flex-direction: row;
  align-items:center;
  justify-content:center;
  gap: 10px;
  text-align:center;
}
.hoop-scene{
  width: 100px;
  max-width: 100px;
  height: auto;
  margin-bottom: 0;
  flex-shrink: 0;
}
.hoop-scene .ball{
  transform-origin: center;
  animation: swish 1.1s cubic-bezier(.45,0,.55,1) 1;
}
.hoop-scene .net-line{
  animation: netShake 0.5s ease-out 1.05s;
}
@keyframes swish{
  0%{ transform: translate(-70px,-55px) rotate(-90deg) scale(0.9); opacity:0; }
  55%{ opacity:1; }
  100%{ transform: translate(0,0) rotate(20deg) scale(1); }
}
@keyframes netShake{
  0%{ transform: scaleY(1); }
  30%{ transform: scaleY(1.12); }
  60%{ transform: scaleY(0.95); }
  100%{ transform: scaleY(1); }
}
@media (prefers-reduced-motion: reduce){
  .hoop-scene .ball, .hoop-scene .net-line{ animation: none; }
}
.hero h1{
  font-family: 'Anton', sans-serif;
  font-weight: 400;
  font-size: 26px;
  letter-spacing: 0.5px;
  margin: 0;
  line-height: 1;
  position: relative;
}
.hero h1 span{ color: var(--orange); }

/* CONTROLS */
.controls{
  display:flex;
  gap:10px;
  padding: 18px 24px 0;
  flex-wrap: wrap;
}
.btn{
  border:none;
  border-radius: 10px;
  padding: 12px 16px;
  font-family:'Inter';
  font-weight:600;
  font-size: 14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  transition: transform .12s ease, background .15s ease;
}
.btn:active{ transform: scale(0.96); }
.btn-primary{ background: var(--orange); color:#fff; }
.btn-primary:hover{ background: var(--orange-light); }
.btn-ghost{ background: var(--panel-2); color: var(--text); border:1px solid var(--line); }
.btn-ghost:hover{ background: #2a3244; }

/* GAMES LIST */
.games{
  padding: 20px 24px 0;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.empty{
  color: var(--muted);
  text-align:center;
  padding: 50px 20px;
  font-size:14px;
  border: 1px dashed var(--line);
  border-radius: 14px;
}

.game-card{
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  display:flex;
  gap:14px;
}
.date-badge{
  flex: 0 0 62px;
  background: var(--panel-2);
  border-radius: 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding: 10px 4px;
  border: 1px solid var(--line);
}
.date-badge .dow{
  font-size: 11px;
  color: var(--orange-light);
  font-weight: 700;
}
.date-badge .dom{
  font-family:'Anton';
  font-size: 26px;
  line-height: 1;
  margin-top: 2px;
}
.date-badge .mon{
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.game-body{ flex:1; min-width:0; }
.game-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom: 10px;
}
.date-input{
  background: transparent;
  border:none;
  color: var(--text);
  font-family:'Inter';
  font-weight:600;
  font-size: 13px;
  cursor:pointer;
  padding: 4px 0;
  color-scheme: dark;
}
.del-btn{
  background:none;
  border:none;
  color: var(--muted);
  cursor:pointer;
  font-size: 16px;
  padding: 4px 6px;
  border-radius:8px;
  line-height:1;
}
.del-btn:hover{ color:#e8544a; background: rgba(232,84,74,0.1); }

.meta-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.meta-field{
  display:flex;
  align-items:center;
  gap:5px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 9px;
}
.meta-field .ic{ font-size: 12px; opacity:0.8; }
.time-input{
  background: transparent;
  border:none;
  color: var(--text);
  font-family:'Inter';
  font-weight:600;
  font-size: 13px;
  cursor:pointer;
  color-scheme: dark;
  width: 68px;
}
.loc-input{
  background: transparent;
  border:none;
  color: var(--text);
  font-family:'Inter';
  font-weight:500;
  font-size: 13px;
  width: 110px;
}
.loc-input::placeholder{ color: var(--muted); }

.leg{
  display:flex;
  align-items:center;
  gap:10px;
  padding: 8px 0;
}
.leg + .leg{ border-top: 1px solid var(--line); }
.leg-back{
  background: rgba(61,127,196,0.08);
  margin: 0 -16px;
  padding: 8px 16px;
  border-radius: 0 0 10px 10px;
}
.leg-label{
  flex: 0 0 60px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
}
.leg-label.to{ color: var(--court); }
.leg-label.back{ color: #6fa8d6; font-weight: 800; }

.pills{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  flex:1;
}
.pill{
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 13px;
  font-size: 13px;
  font-weight: 600;
  cursor:pointer;
  transition: all .12s ease;
}
.pill:hover{ border-color: var(--orange); color: var(--text); }
.pill.active{
  background: var(--orange);
  border-color: var(--orange);
  color: #fff;
}
.pills[data-dir="back"] .pill.active{
  background: #3d7fc4;
  border-color: #3d7fc4;
}
.pill.none{ font-weight:500; }

/* DRIVERS PANEL */
.drawer{
  margin: 0 24px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin-top: 14px;
  display:none;
}
.drawer.open{ display:block; }
.drawer h3{
  margin: 0 0 12px;
  font-size: 14px;
  color: var(--muted);
  font-weight:700;
}
.driver-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom: 8px;
}
.driver-row input{
  flex:1;
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 8px;
  padding: 9px 12px;
  font-family:'Inter';
  font-size:14px;
}
.driver-row input:focus{ outline:1px solid var(--orange); border-color: var(--orange); }
.icon-btn{
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 8px;
  width:34px; height:34px;
  cursor:pointer;
  font-size:15px;
  flex-shrink:0;
}
.icon-btn:hover{ color:#e8544a; border-color:#e8544a44; }
.add-driver{
  display:flex;
  gap:8px;
  margin-top: 10px;
}
.add-driver input{
  flex:1;
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 8px;
  padding: 9px 12px;
  font-family:'Inter';
  font-size:14px;
}

.status{
  text-align:center;
  font-size: 12px;
  color: var(--muted);
  padding: 16px 24px 0;
}

@media (max-width: 420px){
  .hero h1{ font-size: 32px; }
  .leg-label{ flex-basis: 50px; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <div class="hero-top">
      <svg class="hoop-scene" viewBox="0 0 220 190" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="ballShine" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
            <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- pole -->
        <rect x="192" y="30" width="7" height="150" rx="2" fill="#3a4152"/>

        <!-- backboard -->
        <rect x="150" y="22" width="10" height="70" rx="2" fill="#e9e4d8"/>
        <rect x="150" y="22" width="10" height="70" rx="2" fill="none" stroke="#3a4152" stroke-width="1.5"/>
        <rect x="153" y="48" width="4" height="18" fill="none" stroke="#e8630a" stroke-width="1.5"/>

        <!-- rim -->
        <ellipse cx="128" cy="92" rx="30" ry="7" fill="none" stroke="#e8630a" stroke-width="5"/>
        <ellipse cx="128" cy="92" rx="30" ry="7" fill="none" stroke="#a84e05" stroke-width="1.5" opacity="0.5"/>

        <!-- net -->
        <g class="net-line" stroke="#cdd3de" stroke-width="1.3" fill="none" opacity="0.85">
          <path d="M101 94 L110 130"/>
          <path d="M110 93 L116 132"/>
          <path d="M120 93 L122 134"/>
          <path d="M128 93 L128 135"/>
          <path d="M136 93 L134 134"/>
          <path d="M146 93 L140 132"/>
          <path d="M155 94 L146 130"/>
          <path d="M104 108 L152 108"/>
          <path d="M108 120 L148 120"/>
          <path d="M114 130 L142 130"/>
        </g>

        <!-- motion trail -->
        <path d="M40 30 Q 75 45 100 75" stroke="#e8630a" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round" fill="none" opacity="0.55"/>

        <!-- ball -->
        <g class="ball">
          <circle cx="42" cy="30" r="26" fill="#e8630a"/>
          <circle cx="42" cy="30" r="26" fill="none" stroke="#a84e05" stroke-width="1.5"/>
          <path d="M42 4 V56" stroke="#3a1c05" stroke-width="2" fill="none"/>
          <path d="M16 30 H68" stroke="#3a1c05" stroke-width="2" fill="none"/>
          <path d="M22 10 C33 20, 33 40, 22 50" stroke="#3a1c05" stroke-width="2" fill="none"/>
          <path d="M62 10 C51 20, 51 40, 62 50" stroke="#3a1c05" stroke-width="2" fill="none"/>
          <circle cx="42" cy="30" r="26" fill="url(#ballShine)"/>
        </g>
      </svg>
      <h1>הסעות <span>לכדורסל</span></h1>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="addGameBtn">+ הוספת תאריך</button>
    <button class="btn btn-ghost" id="toggleDriversBtn">ניהול נהגים</button>
  </div>

  <div class="drawer" id="driversDrawer">
    <h3>רשימת נהגים</h3>
    <div id="driverList"></div>
    <div class="add-driver">
      <input type="text" id="newDriverInput" placeholder="שם נהג חדש">
      <button class="btn btn-primary" id="addDriverBtn" style="padding:9px 14px;">הוסף</button>
    </div>
  </div>

  <div class="games" id="gamesList"></div>

  <div class="status" id="statusLine">טוען...</div>
</div>

<script>
const DOW = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const MON = ['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];

let drivers = ['גל','אליה','לוי'];
let rides = []; // {id, date: 'YYYY-MM-DD', to: driverName|null, back: driverName|null}

const gamesList = document.getElementById('gamesList');
const driverList = document.getElementById('driverList');
const statusLine = document.getElementById('statusLine');
const driversDrawer = document.getElementById('driversDrawer');

function uid(){ return 'r' + Date.now() + Math.floor(Math.random()*1000); }

// window.storage only exists inside Claude's artifact viewer (shared, synced across everyone).
// When this file is hosted on a regular server, we fall back to the browser's local storage
// so the app still saves — but then data stays on this device/browser only, not shared.
const hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage !== null);

async function storageGet(key){
  if(hasClaudeStorage) return await window.storage.get(key, true);
  const raw = localStorage.getItem(key);
  if(raw === null) throw new Error('not found');
  return { value: raw };
}
async function storageSet(key, value){
  if(hasClaudeStorage) return await window.storage.set(key, value, true);
  localStorage.setItem(key, value);
  return { value };
}

async function loadData(){
  try{
    const d = await storageGet('drivers');
    if(d && d.value) drivers = JSON.parse(d.value);
  }catch(e){}
  try{
    const r = await storageGet('rides');
    if(r && r.value) rides = JSON.parse(r.value);
  }catch(e){}
  render();
  statusLine.textContent = hasClaudeStorage
    ? 'הנתונים משותפים לכל מי שפותח את האפליקציה'
    : 'הנתונים נשמרים על המכשיר הזה בלבד';
}

async function saveDrivers(){
  try{ await storageSet('drivers', JSON.stringify(drivers)); }
  catch(e){ statusLine.textContent = 'שגיאה בשמירת נהגים'; }
}
async function saveRides(){
  try{ await storageSet('rides', JSON.stringify(rides)); }
  catch(e){ statusLine.textContent = 'שגיאה בשמירת נתונים'; }
}

function formatBadge(dateStr){
  if(!dateStr) return {dow:'—', dom:'--', mon:''};
  const d = new Date(dateStr + 'T00:00:00');
  return { dow: DOW[d.getDay()], dom: d.getDate(), mon: MON[d.getMonth()] };
}

function sortRides(){
  rides.sort((a,b) => (a.date||'').localeCompare(b.date||''));
}

function render(){
  renderDrivers();
  renderGames();
}

function renderDrivers(){
  driverList.innerHTML = '';
  drivers.forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'driver-row';
    row.innerHTML = `
      <input type="text" value="${escapeHtml(name)}" data-idx="${i}">
      <button class="icon-btn" data-remove="${i}">✕</button>
    `;
    driverList.appendChild(row);
  });

  driverList.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('change', e => {
      const idx = +e.target.dataset.idx;
      const oldName = drivers[idx];
      const newName = e.target.value.trim();
      if(!newName) { e.target.value = oldName; return; }
      drivers[idx] = newName;
      rides.forEach(r => {
        if(r.to === oldName) r.to = newName;
        if(r.back === oldName) r.back = newName;
      });
      saveDrivers(); saveRides(); render();
    });
  });
  driverList.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = +e.target.dataset.remove;
      const name = drivers[idx];
      drivers.splice(idx,1);
      rides.forEach(r => {
        if(r.to === name) r.to = null;
        if(r.back === name) r.back = null;
      });
      saveDrivers(); saveRides(); render();
    });
  });
}

function renderGames(){
  gamesList.innerHTML = '';
  if(rides.length === 0){
    gamesList.innerHTML = `<div class="empty">אין עדיין תאריכים. לחצו על "+ הוספת תאריך" כדי להתחיל.</div>`;
    return;
  }
  sortRides();
  rides.forEach(ride => {
    const b = formatBadge(ride.date);
    const card = document.createElement('div');
    card.className = 'game-card';
    card.innerHTML = `
      <div class="date-badge">
        <div class="dow">${b.dow}</div>
        <div class="dom">${b.dom}</div>
        <div class="mon">${b.mon}</div>
      </div>
      <div class="game-body">
        <div class="game-top">
          <input type="date" class="date-input" value="${ride.date}" data-id="${ride.id}">
          <button class="del-btn" data-del="${ride.id}">✕</button>
        </div>
        <div class="meta-row">
          <div class="meta-field">
            <span class="ic">🕐</span>
            <input type="time" class="time-input" value="${ride.time || ''}" data-id="${ride.id}">
          </div>
          <div class="meta-field">
            <span class="ic">📍</span>
            <input type="text" class="loc-input" placeholder="מיקום" value="${escapeHtml(ride.location || '')}" data-id="${ride.id}">
          </div>
        </div>
        <div class="leg">
          <div class="leg-label to">הלוך</div>
          <div class="pills" data-id="${ride.id}" data-dir="to">
            ${pillsHtml(ride, 'to')}
          </div>
        </div>
        <div class="leg leg-back">
          <div class="leg-label back">חזור</div>
          <div class="pills" data-id="${ride.id}" data-dir="back">
            ${pillsHtml(ride, 'back')}
          </div>
        </div>
      </div>
    `;
    gamesList.appendChild(card);
  });

  gamesList.querySelectorAll('.date-input').forEach(inp => {
    inp.addEventListener('change', e => {
      const id = e.target.dataset.id;
      const ride = rides.find(r => r.id === id);
      if(ride && e.target.value){ ride.date = e.target.value; saveRides(); render(); }
    });
  });
  gamesList.querySelectorAll('.time-input').forEach(inp => {
    inp.addEventListener('change', e => {
      const id = e.target.dataset.id;
      const ride = rides.find(r => r.id === id);
      if(ride){ ride.time = e.target.value; saveRides(); }
    });
  });
  gamesList.querySelectorAll('.loc-input').forEach(inp => {
    inp.addEventListener('change', e => {
      const id = e.target.dataset.id;
      const ride = rides.find(r => r.id === id);
      if(ride){ ride.location = e.target.value; saveRides(); }
    });
  });
  gamesList.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => {
      const id = e.target.dataset.del;
      rides = rides.filter(r => r.id !== id);
      saveRides(); render();
    });
  });
  gamesList.querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', e => {
      const wrap = e.target.closest('.pills');
      const id = wrap.dataset.id;
      const dir = wrap.dataset.dir;
      const val = e.target.dataset.value === '__none__' ? null : e.target.dataset.value;
      const ride = rides.find(r => r.id === id);
      if(ride){ ride[dir] = val; saveRides(); render(); }
    });
  });
}

function pillsHtml(ride, dir){
  let html = '';
  drivers.forEach(name => {
    const active = ride[dir] === name;
    html += `<button type="button" class="pill ${active ? 'active' : ''}" data-value="${escapeHtml(name)}">${escapeHtml(name)}</button>`;
  });
  const noneActive = !ride[dir];
  html += `<button type="button" class="pill none ${noneActive ? 'active' : ''}" data-value="__none__">אין</button>`;
  return html;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('addGameBtn').addEventListener('click', () => {
  const today = new Date();
  const iso = today.toISOString().slice(0,10);
  rides.push({ id: uid(), date: iso, time: '', location: '', to: null, back: null });
  saveRides(); render();
});

document.getElementById('toggleDriversBtn').addEventListener('click', () => {
  driversDrawer.classList.toggle('open');
});

document.getElementById('addDriverBtn').addEventListener('click', () => {
  const inp = document.getElementById('newDriverInput');
  const name = inp.value.trim();
  if(!name) return;
  if(drivers.includes(name)){ inp.value=''; return; }
  drivers.push(name);
  inp.value = '';
  saveDrivers(); render();
});
document.getElementById('newDriverInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('addDriverBtn').click();
});

loadData();
</script>

</body>
</html>
